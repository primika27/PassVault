[project]
name = "passvault"
version = "0.1.0"
description = "PassVault FastAPI backend"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.139,<1",
	"uvicorn>=0.30,<1",
	"SQLAlchemy>=2,<3",
	"python-dotenv>=1,<2",
	"argon2-cffi>=25,<26",
	"pydantic>=2,<3",
	"zxcvbn>=4,<5",
	"email-validator>=2,<3",
]

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.scripts]
build = "python backend/build.py"
