version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: passvault_postgres
    restart: always
    env_file:
      - .env  # Automatically reads variables from backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-passvault_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .                  # Sets build context to backend/ root
      dockerfile: src/app/Dockerfile # Points to where Dockerfile lives
    container_name: passvault_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env  # Loads backend/.env into FastAPI container
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres

volumes:
  pgdata: